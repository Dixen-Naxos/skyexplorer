name: Front CI

on:
  workflow_dispatch:
  push:
    branches: [ "main", "ci" ]
    paths: [ "front/**" ]

env:
  VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
  VITE_API_URL: ${{ secrets.VITE_API_URL }}

permissions:
  contents: write

concurrency:
  group: release-front
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          PREFIX: front-v
          SCOPE: front/
        run: |
          last=$(git describe --tags --abbrev=0 --match "${PREFIX}[0-9]*" 2>/dev/null || true)
          if [ -z "$last" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "${last#"$PREFIX"}"
            log=$(git log --format='%s%n%b' "$last"..HEAD -- $SCOPE)
            if grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE' <<< "$log"; then next="$((major+1)).0.0"
            elif grep -qE '^feat(\(.+\))?:' <<< "$log"; then next="$major.$((minor+1)).0"
            else next="$major.$minor.$((patch+1))"; fi
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            next="$next-${GITHUB_REF_NAME//\//-}.${GITHUB_SHA::7}"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create .env file
        run: |
          touch ./front/.env
          echo "VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" >> ./front/.env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> ./front/.env

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          secrets: "env_file=./front/.env"
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/expedition25:front
            ${{ secrets.DOCKERHUB_USERNAME }}/expedition25:front-${{ steps.version.outputs.version }}

      - name: Tag release
        if: github.ref == 'refs/heads/main'
        run: |
          git tag "front-v${{ steps.version.outputs.version }}"
          git push origin "front-v${{ steps.version.outputs.version }}"

      - name: Redeploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOSTNAME }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd expedition25/
            docker compose pull
            docker compose up -d
            docker image prune -f